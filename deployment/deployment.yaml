apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkasa-app-deployment
spec:
  selector:
    matchLabels:
      app: linkasa-app
  replicas: 2
  template:
    metadata:
      labels:
        app: linkasa-app
    spec:
      containers:
      - name: app
        image: techtestxkaxel.azurecr.io/frontend
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: linkasa-app
spec:
  selector:
      app: linkasa-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
